name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-wefaber
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Deploy
        run: |
          bash /home/hermes/deploy/generic.sh \
            "wefaber.net" \
            "https://github.com/wefaber/wefaber.git" \
            "main"
