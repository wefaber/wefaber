<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      %TOKENS% are substituted at build time from src/config/site.ts and the
      English copy. See the `seoHtml` plugin in vite.config.ts. Do not hardcode
      values here; edit the config instead.

      These tags duplicate src/components/SEO.tsx on purpose: social scrapers
      (Twitter, LinkedIn, Slack) do not execute JS, so the English set has to be
      present in the served HTML.

      React 19 hoists the metadata SEO.tsx renders by APPENDING it, and never
      dedupes against what is already here, so leaving these in place would show
      crawlers two titles and two canonicals. Every tag marked
      data-static-seo="true" is therefore removed by SEO.tsx once its own
      equivalents are live. Only mark a tag here if SEO.tsx also renders it.
    -->
    <title data-static-seo="true">%META_TITLE%</title>
    <meta data-static-seo="true" name="description" content="%META_DESCRIPTION%" />
    <link data-static-seo="true" rel="canonical" href="%SITE_URL%" />
    <meta data-static-seo="true" name="robots" content="index, follow, max-image-preview:large" />

    <meta data-static-seo="true" property="og:type" content="website" />
    <meta data-static-seo="true" property="og:site_name" content="%SITE_NAME%" />
    <meta data-static-seo="true" property="og:title" content="%META_TITLE%" />
    <meta data-static-seo="true" property="og:description" content="%META_DESCRIPTION%" />
    <meta data-static-seo="true" property="og:url" content="%SITE_URL%" />
    <meta data-static-seo="true" property="og:locale" content="%OG_LOCALE%" />
    <meta data-static-seo="true" property="og:locale:alternate" content="%OG_LOCALE_ALT%" />
    <meta data-static-seo="true" property="og:image" content="%OG_IMAGE%" />
    <meta data-static-seo="true" property="og:image:width" content="%OG_IMAGE_WIDTH%" />
    <meta data-static-seo="true" property="og:image:height" content="%OG_IMAGE_HEIGHT%" />
    <meta data-static-seo="true" property="og:image:alt" content="%OG_IMAGE_ALT%" />

    <meta data-static-seo="true" name="twitter:card" content="summary_large_image" />
    <meta data-static-seo="true" name="twitter:title" content="%META_TITLE%" />
    <meta data-static-seo="true" name="twitter:description" content="%META_DESCRIPTION%" />
    <meta data-static-seo="true" name="twitter:image" content="%OG_IMAGE%" />

    <!-- Unmarked: constant across languages, so SEO.tsx leaves these alone. -->
    <meta name="theme-color" content="#fffadc" />
    <!-- Generated by `bun run assets` from /brand. Do not edit /public by hand. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Above-the-fold faces only; the mono subset is small and below the fold. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/druk-text-wide-super.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; max-width: 40rem">
        %META_DESCRIPTION% This page needs JavaScript enabled, or write to us
        directly at <a href="mailto:%SITE_EMAIL%">%SITE_EMAIL%</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
